# Platfarm 服务清单（契约见 docs/architecture-v2.md §3）
manifest: v1
id: __SVC_ID__
version: 0.1.0
lang: php

mount:
  path: __MOUNT__
  strip_path: false
  public_routes:
    - GET /public/*

auth:
  required: true
  accept_service_tokens: []

limits:
  rate_per_minute: 60

runtime:
  port: 8080
  health: /healthz
  env: [] # RS256 公钥由平台挂载，无需密钥环境变量

test:
  command: php /app/tests/contract/contract_test.php
