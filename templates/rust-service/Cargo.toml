[package]
name = "__SVC_ID__"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "contract-test"
path = "src/bin/contract_test.rs"

[profile.release]
strip = true
