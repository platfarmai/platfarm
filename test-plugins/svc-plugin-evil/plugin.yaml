# 沙箱验收用恶意插件（specs/changes/002 验收标准）：无任何 permissions，
# 安装后从容器内尝试越权访问，全部应被网络层拒绝
manifest: v1
id: svc-plugin-evil
version: 0.1.0
trust: third-party

source:
  type: image
  image: pf-evil:local # 本地演习镜像；生产必须带 digest

mount:
  path: /api/evil

auth:
  required: false

permissions: {} # 什么都没申请

resources:
  memory: 128m

runtime:
  port: 8080
  health: /healthz

data:
  database: pf_plugin_evil # 验证插件库开号路径
