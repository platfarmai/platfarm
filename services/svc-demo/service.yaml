# Platfarm 服务清单（契约见 docs/architecture-v2.md §3）
# 试运行阶段 gateway/kong.yml 为手写；pctl sync 就绪后由本清单生成
manifest: v1
id: svc-demo
version: 0.1.0
lang: py

mount:
  path: /api/demo
  strip_path: false
  public_routes:
    - GET /public/*

auth:
  required: true
  accept_service_tokens: []

limits:
  rate_per_minute: 30

runtime:
  port: 8080
  health: /healthz
  env: [] # RS256 公钥由平台挂载，无需密钥环境变量

test:
  command: python3 tests/contract/contract_test.py
