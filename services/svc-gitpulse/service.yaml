# svc-gitpulse — GitHub 提交分析与项目周期管理：定时轮询 commit 元数据，
# AI 生成中文日报/周报与规范检查，前端提 issue 自动关联修复 commit 并核验 lead time。
manifest: v1
id: svc-gitpulse
version: 0.1.0
lang: go

mount:
  path: /api/gitpulse
  strip_path: false
  public_routes:
    - GET /console/*  # console 静态页公开，API 仍受 JWT 保护；SPA 内 401 自动跳登录

auth:
  required: true
  accept_service_tokens: []

limits:
  rate_per_minute: 120

admin_ui:
  path: /console
  embed: true
  title: GitPulse

runtime:
  port: 8080
  health: /healthz
  env:
    - GITPULSE_DATABASE_URL
    - GITHUB_TOKEN
    - ANTHROPIC_API_KEY
    - ANTHROPIC_BASE_URL
    - GITPULSE_AI_MODEL
    - GITPULSE_POLL_MINUTES

data:
  database: pf_svc_gitpulse

test:
  command: /contract-test
