# PlatFarm 开放平台管理台（specs/010）。admin-only；经 SSO 壳嵌入。
manifest: v1
id: svc-openapi
version: 0.1.0
lang: go

mount:
  path: /api/openapi
  strip_path: false

auth:
  required: true
  accept_service_tokens: []

limits:
  rate_per_minute: 120

admin_ui:
  path: /console
  embed: true
  title: OpenAPI

runtime:
  port: 8080
  health: /healthz
  env:
    - OPENAPI_CLIENT_ID
    - OPENAPI_CLIENT_SECRET
    - LOKI_URL

test:
  command: wget -qO- http://127.0.0.1:8080/healthz # compose exec 不经 shell，不能用重定向/管道
