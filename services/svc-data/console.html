<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数据集管理 · svc-data</title>
<style>
  :root { --bd:#d0d7de; --muted:#57606a; --accent:#0969da; --bg:#f6f8fa; }
  * { box-sizing:border-box; }
  body { font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; padding:24px; color:#1f2328; background:var(--bg); }
  h1 { font-size:18px; margin:0 0 16px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--bd); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  button { border:1px solid var(--bd); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover { filter:brightness(0.96); }
  input,textarea { border:1px solid var(--bd); border-radius:6px; padding:6px 8px; font:inherit; width:100%; }
  textarea { font-family:ui-monospace,Consolas,monospace; font-size:12px; min-height:180px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:12px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px; }
  .pill { display:inline-block; padding:0 8px; border-radius:10px; font-size:12px; }
  .on { background:#dafbe1; color:#116329; } .off { background:#ffebe9; color:#cf222e; }
  #msg { color:var(--accent); min-height:20px; margin-bottom:8px; white-space:pre-wrap; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
</style>
</head>
<body>
<h1>数据集管理 <span style="color:var(--muted);font-weight:400">· 接入规则与字段在此编辑，改完即生效</span></h1>
<div id="msg"></div>

<div class="card">
  <table id="list"><thead>
    <tr><th>ID</th><th>名称</th><th>来源</th><th>主键字段</th><th>规则数</th><th>状态</th><th>记录数</th><th>操作</th></tr>
  </thead><tbody></tbody></table>
  <div class="row" style="margin-top:12px"><button class="primary" onclick="edit(null)">新建数据集</button></div>
</div>

<div class="card" id="editor" style="display:none">
  <h1 id="ed-title"></h1>
  <div class="grid">
    <div><label>ID（新建后不可改）</label><input id="ed-id"></div>
    <div><label>名称</label><input id="ed-name"></div>
    <div><label>来源标识（source）</label><input id="ed-source"></div>
    <div><label>主键字段（pk_field，支持点路径）</label><input id="ed-pk"></div>
  </div>
  <label>抽取规则 index_rules（标量：field/path；数组：mode=array + key_path/value_path）</label>
  <textarea id="ed-rules"></textarea>
  <div class="grid">
    <div><label>留存天数 retention_days（0 = 永久）</label><input id="ed-retention" type="number" min="0"></div>
    <div><label>变更通知 URL（入库成功后 POST 通知下游，可空）</label><input id="ed-notify"></div>
  </div>
  <label>Webhook 密钥（提供给推送方；端点 <code>POST /api/data/ingest/&lt;ID&gt;</code>；仅创建/轮换时显示一次）</label>
  <div class="row"><input id="ed-secret" readonly style="flex:1"><button onclick="rotate()">换新密钥</button></div>
  <div class="row" style="margin-top:12px">
    <button class="primary" onclick="save()">保存</button>
    <button onclick="reindex()">重建索引（规则变更后）</button>
    <button onclick="purge()">清理过期数据</button>
    <button onclick="toggle()">启用/停用</button>
    <button onclick="del()">删除…</button>
    <button onclick="hide()">收起</button>
  </div>
</div>

<div class="card" id="tools" style="display:none">
  <h1>规则试跑 / 数据浏览 / 审计</h1>
  <label>样例 payload（粘贴一条真实推送数据，用当前规则预览会抽出什么）</label>
  <textarea id="pv-payload" style="min-height:90px"></textarea>
  <div class="row" style="margin-top:8px"><button onclick="preview()">试跑</button></div>
  <pre id="pv-out" style="background:var(--bg);padding:8px;border-radius:6px;overflow:auto"></pre>
  <div class="row"><button onclick="browse()">浏览最近 20 条数据</button><button onclick="audit()">查看审计日志</button></div>
  <pre id="tool-out" style="background:var(--bg);padding:8px;border-radius:6px;overflow:auto;max-height:320px"></pre>
</div>

<script>
const api = p => `/api/data/admin${p}`;
let datasets = [], cur = null, stats = {};

async function call(method, path, body) {
  const r = await fetch(api(path), { method, headers: {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const say = t => document.getElementById('msg').textContent = t;

async function refresh() {
  try {
    const [d, s] = await Promise.all([
      call('GET', '/datasets'),
      fetch('/api/data/stats').then(r => r.json()).catch(() => ({datasets:[]}))
    ]);
    datasets = d.datasets; stats = Object.fromEntries((s.datasets||[]).map(x => [x.dataset, x.records]));
    const tb = document.querySelector('#list tbody'); tb.innerHTML = '';
    for (const ds of datasets) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><code>${ds.id}</code></td><td>${ds.name||''}</td><td>${ds.source||''}</td>
        <td><code>${ds.pkField}</code></td><td>${(ds.indexRules||[]).length}</td>
        <td><span class="pill ${ds.enabled?'on':'off'}">${ds.enabled?'启用':'停用'}</span></td>
        <td>${stats[ds.id] ?? 0}</td><td><button onclick='edit(${JSON.stringify(ds.id)})'>编辑</button></td>`;
      tb.appendChild(tr);
    }
  } catch (e) { say('加载失败：' + e.message); }
}

function edit(id) {
  cur = id === null ? null : datasets.find(d => d.id === id);
  document.getElementById('editor').style.display = '';
  document.getElementById('ed-title').textContent = cur ? `编辑：${cur.id}` : '新建数据集';
  document.getElementById('ed-id').value = cur?.id || '';
  document.getElementById('ed-id').disabled = !!cur;
  document.getElementById('ed-name').value = cur?.name || '';
  document.getElementById('ed-source').value = cur?.source || '';
  document.getElementById('ed-pk').value = cur?.pkField || 'id';
  document.getElementById('ed-rules').value = JSON.stringify(cur?.indexRules || [], null, 2);
  document.getElementById('ed-retention').value = cur?.retentionDays ?? 0;
  document.getElementById('ed-notify').value = cur?.notifyUrl || '';
  document.getElementById('ed-secret').value = '（密钥不明文存储，仅创建/轮换时显示一次）';
  document.getElementById('tools').style.display = cur ? '' : 'none';
}
const hide = () => document.getElementById('editor').style.display = 'none';

function form() {
  let rules;
  try { rules = JSON.parse(document.getElementById('ed-rules').value || '[]'); }
  catch { throw new Error('index_rules 不是合法 JSON'); }
  return { name: document.getElementById('ed-name').value, source: document.getElementById('ed-source').value,
    pkField: document.getElementById('ed-pk').value, indexRules: rules,
    retentionDays: parseInt(document.getElementById('ed-retention').value || '0', 10),
    notifyUrl: document.getElementById('ed-notify').value };
}

async function save() {
  try {
    const id = document.getElementById('ed-id').value.trim();
    if (!id) throw new Error('ID 必填');
    const r = cur ? await call('PUT', `/datasets/${id}`, form())
                  : await call('POST', `/datasets/${id}`, form());
    say(cur ? (r.hint || '已保存') : `已创建，Webhook 密钥：${r.webhookSecret}`);
    await refresh(); if (!cur) edit(id); else edit(id);
  } catch (e) { say('保存失败：' + e.message); }
}
async function rotate() {
  if (!cur || !confirm('换新密钥后，推送方必须同步更新，确认？')) return;
  try { const r = await call('POST', `/datasets/${cur.id}/rotate-secret`);
    document.getElementById('ed-secret').value = r.webhookSecret; say('密钥已更换'); await refresh();
  } catch (e) { say('失败：' + e.message); }
}
async function preview() {
  if (!cur) return;
  try {
    const payload = JSON.parse(document.getElementById('pv-payload').value || '{}');
    const r = await call('POST', `/datasets/${cur.id}/preview`, { indexRules: form().indexRules, payload });
    document.getElementById('pv-out').textContent = JSON.stringify(r.entries, null, 2);
  } catch (e) { say('试跑失败：' + e.message); }
}
async function browse() {
  if (!cur) return;
  try {
    const r = await fetch(`/api/data/records?dataset=${cur.id}&limit=20`).then(x => x.json());
    document.getElementById('tool-out').textContent =
      `共 ${r.total} 条，显示 ${r.items.length} 条\n` + JSON.stringify(r.items, null, 2);
  } catch (e) { say('失败：' + e.message); }
}
async function audit() {
  if (!cur) return;
  try {
    const r = await call('GET', `/datasets/${cur.id}/audit`);
    document.getElementById('tool-out').textContent = (r.audit || []).map(e =>
      `${e.createdAt}  ${e.actor}  ${e.action}  ${JSON.stringify(e.detail)}`).join('\n') || '（无审计记录）';
  } catch (e) { say('失败：' + e.message); }
}
async function purge() {
  if (!cur) return;
  try { const r = await call('POST', `/datasets/${cur.id}/purge`); say(`已清理 ${r.deleted} 条过期记录`); await refresh(); }
  catch (e) { say('失败：' + e.message); }
}
async function reindex() {
  if (!cur) return;
  try { const r = await call('POST', `/datasets/${cur.id}/reindex`); say(`已按当前规则重建索引：${r.reindexed} 条记录`); }
  catch (e) { say('失败：' + e.message); }
}
async function toggle() {
  if (!cur) return;
  try { await call('PUT', `/datasets/${cur.id}`, { ...form(), enabled: !cur.enabled });
    say(cur.enabled ? '已停用（webhook 将拒收）' : '已启用'); await refresh(); edit(cur.id);
  } catch (e) { say('失败：' + e.message); }
}
async function del() {
  if (!cur) return;
  const purge = confirm('同时删除已入库数据？（确定=连数据删，取消=仅删配置）');
  if (!confirm(`确认删除数据集 ${cur.id}${purge ? '（含数据）' : ''}？`)) return;
  try { await call('DELETE', `/datasets/${cur.id}${purge ? '?purge=true' : ''}`); say('已删除'); hide(); await refresh(); }
  catch (e) { say('失败：' + e.message); }
}
refresh();
</script>
</body>
</html>
