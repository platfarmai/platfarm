# svc-file — 文件能力服务（specs/016，架构 §5 参考实现）：元数据 + 归属判定 + 预签名 URL。
# 文件字节流不过本服务（浏览器 ↔ MinIO 直传直下）。
manifest: v1
id: svc-file
version: 0.1.0
lang: go

mount:
  path: /api/file
  strip_path: false

auth:
  required: true
  accept_service_tokens: []

limits:
  rate_per_minute: 120

exposes:
  scopes:
    - { name: read, desc: 读取文件元数据与下载链接 }

runtime:
  port: 8080
  health: /healthz
  env:
    - FILE_DATABASE_URL
    - S3_ENDPOINT
    - S3_PUBLIC_ENDPOINT
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - S3_BUCKET

data:
  database: pf_svc_file

test:
  command: /contract-test
