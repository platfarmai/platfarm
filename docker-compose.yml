# Platfarm 平台基座编排（手维护）
# gateway / plugin-pg / 业务服务在 docker-compose.services.yml —— pctl sync 生成，勿手改
# （gateway 在生成文件的原因：其 networks 列表随插件网络增减，附录 H.4）
include:
  - docker-compose.services.yml

services:
  # ── 底座层：auth（唯一底座，仅身份；RS256 私钥仅此容器持有） ──
  auth:
    build: ./platform/auth
    environment:
      DATABASE_URL: ${DATABASE_URL} # 三种模式见 .env.example
      JWT_PRIVATE_KEY_FILE: /keys/pf-auth.pem
      PF_REDIS_URL: ${PF_REDIS_URL:-redis://redis:6379/0}
      PF_SELF_REGISTER: ${PF_SELF_REGISTER:-off} # 自助注册开关（specs/018）
      LOKI_URL: ${LOKI_URL:-} # 开放平台日配额强制（specs/023）；空 = fail-open 不强制
      PF_DATA_SECRET: ${PF_DATA_SECRET:-} # 与网关共用；空 = 登录响应不带 dataKey
    volumes:
      - ./.keys:/keys
    extra_hosts:
      - "host.docker.internal:host-gateway" # 宿主机/外部数据库模式需要
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net

  # ── 管理控制台：pctl 的 Web 外壳（附录 H.6），仅本机 18001，admin-only ──
  console:
    build:
      context: ./tools/pctl
      dockerfile: Dockerfile.console
    ports:
      - "127.0.0.1:18001:8080" # 仅本机可访问；远程用 SSH 隧道
    environment:
      PLATFARM_ROOT: /workspace
      AUTH_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /workspace/.keys/pf-auth.pem.pub
      PF_COMPOSE_PROJECT: platfarm
      PF_CONTAINER_HOST: unix:///var/run/docker.sock
    volumes:
      - .:/workspace                            # 真相源文件（sync/启停标记）
      - ${PF_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock # Podman: PF_CONTAINER_SOCKET=/run/user/$UID/podman/podman.sock
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - core-net

  # ── 可选：捆绑数据库（开箱模式，--profile bundled-db 启用） ──
  postgres:
    image: postgres:18-alpine
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: platfarm
      POSTGRES_PASSWORD: ${BUNDLED_DB_PASSWORD:-platfarm_local}
      POSTGRES_DB: pf_auth
    volumes:
      - pf-pg-data:/var/lib/postgresql # postgres:18+ 挂载点
      - ./deploy/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro # 仅新卷首次生效；存量卷手工执行同文件
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platfarm"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net

  # ── Redis：--scale 多副本时限流/吊销/oauth state 共享（单副本也可连，空则回退内存） ──
  redis:
    image: redis:7-alpine
    volumes:
      - pf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net

  # ── 可选：捆绑对象存储（svc-file 的默认后端，--profile bundled-s3 启用；架构 §5）──
  # 外部 S3/OSS 模式：不启用本 profile，改 .env 的 S3_ENDPOINT/S3_PUBLIC_ENDPOINT 指向外部端点
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z # quay 源：Docker Hub 受限环境亦可拉取
    profiles: ["bundled-s3"]
    command: server /data
    ports:
      - "127.0.0.1:19000:9000" # 预签名 URL 直传/直下需宿主可达；生产换公网域名（S3_PUBLIC_ENDPOINT）
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pf_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pf_minio_local}
    volumes:
      - pf-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net

  # ── 可观测/计量（specs/013）：--profile observability 启用 ──
  loki:
    image: grafana/loki:3.2.0
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - pf-loki-data:/loki
    networks:
      - core-net

  promtail:
    image: grafana/promtail:3.2.0
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - core-net

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:18002:3000" # 仅本机；默认账号 admin / GF_ADMIN_PASSWORD
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pf-grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - core-net

networks:
  core-net: # 平台核心网络；插件网络（net-plugin-*）由 pctl sync 生成

volumes:
  pf-pg-data:
  pf-redis-data:
  pf-loki-data:
  pf-minio-data:
  pf-grafana-data:
