# Kong 网关。声明式配置来自 ConfigMap platfarm-kong（由 pctl sync 的 gateway/kong.yml 灌入）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: platfarm-kong
  namespace: platfarm
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: platfarm
  labels:
    app: gateway
    app.kubernetes.io/part-of: platfarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: kong:3.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_UNTRUSTED_LUA
              value: sandbox
            - name: KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES
              value: cjson,resty.openssl.kdf,resty.openssl.cipher,resty.random
            - name: PF_DATA_SECRET
              valueFrom:
                secretKeyRef:
                  name: platfarm-env
                  key: PF_DATA_SECRET
                  optional: true
          volumeMounts:
            - name: kong
              mountPath: /kong
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kong
          configMap:
            name: platfarm-kong
            items:
              - key: kong.yml
                path: kong.yml
