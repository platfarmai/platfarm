apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: platfarm
  labels:
    app: auth
    app.kubernetes.io/part-of: platfarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: platfarm/auth:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: platfarm-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: platfarm
  labels:
    app: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8080
      targetPort: http
