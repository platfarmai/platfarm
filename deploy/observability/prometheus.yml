# Platfarm Prometheus scrape config (opt-in upgrade path; compose remains default).
# Pair with sdk/go/metrics Handler mounted at /metrics on each service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["auth:8080"]

  - job_name: svc-users
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["svc-users:8080"]

  - job_name: svc-file
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["svc-file:8080"]

  - job_name: svc-notify
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["svc-notify:8080"]

  - job_name: svc-jobs
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["svc-jobs:8080"]

  - job_name: svc-grants
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["svc-grants:8080"]
