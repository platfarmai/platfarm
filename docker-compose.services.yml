# ⚠️ GENERATED BY platctl sync — 手改无效，改 services/*/{service,plugin}.yaml 后重新 sync
services:
  gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_NGINX_WORKER_PROCESSES: "1" # 单机限流精确；多实例改 redis policy
    ports:
      - "18000:8000"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on: [auth]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net
  svc-demo:
    build: ./services/svc-demo
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    networks:
      - core-net
  svc-oauth:
    build: ./services/svc-oauth
    environment:
      PF_CLIENT_ID: ${PF_CLIENT_ID}
      PF_CLIENT_SECRET: ${PF_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    networks:
      - core-net
