# ⚠️ GENERATED BY pctl sync — 手改无效，改 services/*/{service,plugin}.yaml 后重新 sync
services:
  gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_NGINX_WORKER_PROCESSES: ${KONG_NGINX_WORKER_PROCESSES:-1} # Redis 限流时可改为 auto
      KONG_UNTRUSTED_LUA: sandbox # pre-function 需 require("cjson")（SSO/开放平台 scope 校验，specs/006+009）
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson
    ports:
      - "18000:8000"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net
  svc-demo:
    build: ./services/svc-demo
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-file:
    build: ./services/svc-file
    environment:
      FILE_DATABASE_URL: ${FILE_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-grants:
    build: ./services/svc-grants
    environment:
      GRANTS_DATABASE_URL: ${GRANTS_DATABASE_URL}
      PF_ACCEPT_SERVICE_TOKENS: svc-demo,svc-file,svc-notify,svc-users,svc-openapi,svc-oauth
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-jobs:
    build: ./services/svc-jobs
    environment:
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL}
      JOBS_CLIENT_ID: ${JOBS_CLIENT_ID}
