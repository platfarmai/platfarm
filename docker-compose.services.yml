# ⚠️ GENERATED BY pctl sync — 手改无效，改 services/*/{service,plugin}.yaml 后重新 sync
services:
  gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_NGINX_WORKER_PROCESSES: ${KONG_NGINX_WORKER_PROCESSES:-1} # Redis 限流时可改为 auto
      KONG_UNTRUSTED_LUA: sandbox # pre-function 需 require("cjson")（SSO/开放平台 scope 校验，specs/006+009）
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson
    ports:
      - "18000:8000"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net
  svc-demo:
    build: ./services/svc-demo
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-oauth:
    build: ./services/svc-oauth
    environment:
      PF_CLIENT_ID: ${PF_CLIENT_ID}
      PF_CLIENT_SECRET: ${PF_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      PF_REDIS_URL: ${PF_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-openapi:
    build: ./services/svc-openapi
    environment:
      OPENAPI_CLIENT_ID: ${OPENAPI_CLIENT_ID}
      OPENAPI_CLIENT_SECRET: ${OPENAPI_CLIENT_SECRET}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-users:
    build: ./services/svc-users
    environment:
      USERS_CLIENT_ID: ${USERS_CLIENT_ID}
      USERS_CLIENT_SECRET: ${USERS_CLIENT_SECRET}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
