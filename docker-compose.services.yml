services:
  gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_NGINX_WORKER_PROCESSES: ${KONG_NGINX_WORKER_PROCESSES:-1} # Redis 限流时可改为 auto
      KONG_UNTRUSTED_LUA: sandbox # pre-function 需 require（SSO/scope 校验 specs/006+009，响应加密附录 F）
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson,resty.openssl.kdf,resty.openssl.cipher,resty.random
    ports:
      - "18000:8000"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net
  svc-demo:
    build: ./services/svc-demo
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-file:
    build: ./services/svc-file
    environment:
      FILE_DATABASE_URL: ${SVC_FILE_FILE_DATABASE_URL:-${FILE_DATABASE_URL}}
      S3_ENDPOINT: ${SVC_FILE_S3_ENDPOINT:-${S3_ENDPOINT}}
      S3_PUBLIC_ENDPOINT: ${SVC_FILE_S3_PUBLIC_ENDPOINT:-${S3_PUBLIC_ENDPOINT}}
      S3_ACCESS_KEY: ${SVC_FILE_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      S3_SECRET_KEY: ${SVC_FILE_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      S3_BUCKET: ${SVC_FILE_S3_BUCKET:-${S3_BUCKET}}
    volumes:
      - ./.keys/pf-auth.pem.pub:/pf/jwt.pub:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - core-net
  svc-grants:
    build: ./services/svc-grants
    environment:
      GRANTS_DATABASE_URL: ${SVC_GRANTS_GRANTS_DATABASE_URL:-${GRANTS_DATABASE_URL}}
      PF_ACCEPT_SERVICE_TOKENS: svc-demo,svc-file,svc-notify,svc-users,svc-openapi,svc-oauth
