_format_version: "3.0"

# ⚠️ GENERATED BY pctl sync — 手改无效，改 services/*/{service,plugin}.yaml 后重新 sync
services:
  - name: auth
    url: http://auth:8080
    retries: 2
    routes:
      - name: auth-route
        paths: ["/auth"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }
      - name: platform-root
        paths: ["/"]
        strip_path: false
  - name: console
    url: http://console:8080
    retries: 2
    routes:
      - name: platform-console
        paths: ["/platform/console"]
        strip_path: true

  - name: svc-demo
    url: http://svc-demo:8080
    retries: 2
    routes:
      - name: svc-demo-public-0
        paths: ["/api/demo/public"]
        strip_path: false
      - name: svc-demo-open-0
        paths: ["/api/demo/data"]
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: pre-function
            config:
              access:
                - |
                    local auth = kong.request.get_header("authorization")
                    if not auth then return kong.response.exit(401, { error = "app token required" }) end
                    local token = string.gsub(auth, "^Bearer%s+", "")
                    local seg = {}
                    for s in string.gmatch(token, "[^.]+") do seg[#seg+1] = s end
                    if #seg < 2 then return kong.response.exit(401, { error = "invalid token" }) end
                    local b64 = seg[2]:gsub("-", "+"):gsub("_", "/")
                    local pad = #b64 % 4
                    if pad > 0 then b64 = b64 .. string.rep("=", 4 - pad) end
                    local raw = ngx.decode_base64(b64)
                    if not raw then return kong.response.exit(401, { error = "invalid token" }) end
                    local ok_json, claims = pcall(function() return require("cjson").decode(raw) end)
                    if not ok_json or not claims then return kong.response.exit(401, { error = "invalid token" }) end
                    if claims.tokenType ~= "app" then return kong.response.exit(403, { error = "open API requires an app token" }) end
                    local ok = false
                    for _, s in ipairs(claims.scopes or {}) do if s == "data.orders.read" then ok = true break end end
                    if not ok then return kong.response.exit(403, { error = "missing scope data.orders.read" }) end
                    kong.service.request.set_header("X-PF-App-Key", claims.appKey or "")
          - name: rate-limiting
            config: { minute: 60, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: header, header_name: X-PF-App-Key }
      - name: svc-demo-protected
        paths: ["/api/demo"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: rate-limiting
            config: { minute: 30, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }

  - name: svc-oauth
    url: http://svc-oauth:8080
    retries: 2
    routes:
      - name: svc-oauth-protected
        paths: ["/api/oauth"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }

  - name: svc-openapi
    url: http://svc-openapi:8080
    retries: 2
    routes:
      - name: svc-openapi-protected
        paths: ["/api/openapi"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: rate-limiting
            config: { minute: 120, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }

  - name: svc-users
    url: http://svc-users:8080
    retries: 2
    routes:
      - name: svc-users-protected
        paths: ["/api/users"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: rate-limiting
            config: { minute: 120, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }

# 全局 pre-function：cookie pf_access → Authorization: Bearer（SSO，specs/006）
plugins:
  - name: pre-function
    config:
      access:
        - |
          local h = kong.request.get_header("authorization")
          if not h then
            local ck = kong.request.get_header("cookie")
            if ck then
              local t = string.match(ck, "pf_access=([^;%s]+)")
              if t then kong.service.request.set_header("authorization", "Bearer " .. t) end
            end
          end

# jwt 插件按 iss=pf-auth 匹配此 consumer，RS256 公钥验签（私钥仅 auth 持有）
