_format_version: "3.0"

# ⚠️ GENERATED BY platctl sync — 手改无效，改 services/*/{service,plugin}.yaml 后重新 sync

services:
  # ── auth 底座（平台静态部分）：/auth 公开，/internal 不路由 ──
  - name: auth
    url: http://auth:8080
    routes:
      - name: auth-route
        paths: ["/auth"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: local, limit_by: ip }

  - name: svc-demo
    url: http://svc-demo:8080
    routes:
      - name: svc-demo-public-0
        paths: ["/api/demo/public"]
        strip_path: false
      - name: svc-demo-protected
        paths: ["/api/demo"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: rate-limiting
            config: { minute: 30, policy: local, limit_by: ip }

  - name: svc-oauth
    url: http://svc-oauth:8080
    routes:
      - name: svc-oauth-protected
        paths: ["/api/oauth"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: local, limit_by: ip }

# jwt 插件按 iss=pf-auth 匹配此 consumer，RS256 公钥验签（私钥仅 auth 持有）
