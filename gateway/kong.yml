      - name: svc-users-public-2
        paths: ["/api/users/account"]
        strip_path: false
      - name: svc-users-protected
        paths: ["/api/users"]
        strip_path: false
        plugins:
          - name: jwt
            config: { key_claim_name: iss, claims_to_verify: ["exp"] }
          - name: pre-function
            config:
              access:
                - |
                    do
                      local auth = kong.request.get_header("authorization")
                      if not auth then
                        local ck = kong.request.get_header("cookie")
                        if ck then
                          local t = string.match(ck, "pf_access=([^;%s]+)")
                          if t then
                            kong.service.request.set_header("authorization", "Bearer " .. t)
                            auth = kong.request.get_header("authorization")
                          end
                        end
                      end
                      if auth then
                        local token = string.gsub(auth, "^Bearer%s+", "")
                        local seg = {}
                        for s in string.gmatch(token, "[^.]+") do seg[#seg+1] = s end
                        if #seg >= 2 then
                          local b64 = seg[2]:gsub("-", "+"):gsub("_", "/")
                          local pad = #b64 % 4
                          if pad > 0 then b64 = b64 .. string.rep("=", 4 - pad) end
                          local raw = ngx.decode_base64(b64)
                          if raw then
                            local ok_json, claims = pcall(function() return require("cjson").decode(raw) end)
                            if ok_json and claims and claims.tokenType == "service" then
                              local allowed = false
                              for _, s in ipairs(claims.scopes or {}) do
                                if s == "svc-users" or string.sub(s, 1, string.len("svc-users:")) == "svc-users:" then allowed = true break end
                              end
                              if not allowed then
                                return kong.response.exit(403, { error = "service token lacks a svc-users scope (declare it in permissions.calls)" })
                              end
                            end
                          end
                        end
                      end
                    end
                    do
                      local authz = kong.request.get_header("authorization")
                      if authz then
                        local token = string.gsub(authz, "^Bearer%s+", "")
                        local seg = {}
                        for s in string.gmatch(token, "[^.]+") do seg[#seg+1] = s end
                        if #seg >= 2 then
                          local b64 = seg[2]:gsub("-", "+"):gsub("_", "/")
                          local pad = #b64 % 4
                          if pad > 0 then b64 = b64 .. string.rep("=", 4 - pad) end
                          local raw = ngx.decode_base64(b64)
                          local ok, claims = raw and pcall(function() return require("cjson").decode(raw) end)
                          if ok and claims and claims.tokenType == "access" then
                            local redis = require("resty.redis")
                            local red = redis:new()
                            red:set_timeouts(200, 200, 200)
                            if red:connect("redis", 6379) then
                              if red:auth(nil, nil) then
                                red:select(0)
                                if claims.tokenId and red:exists("pf:revoke:" .. claims.tokenId) == 1 then
                                  red:set_keepalive(10000, 50)
                                  return kong.response.exit(401, { error = "token revoked" })
                                end
                                if claims.userId and claims.iat then
                                  local cut = red:get("pf:userkill:" .. tostring(claims.userId))
                                  if cut and cut ~= ngx.null and tonumber(cut) and claims.iat < tonumber(cut) then
                                    red:set_keepalive(10000, 50)
                                    return kong.response.exit(401, { error = "token revoked" })
                                  end
                                end
                                red:set_keepalive(10000, 50)
                              else
                                red:close()
                              end
                            end
                          end
                        end
                      end
                    end
          - name: rate-limiting
            config: { minute: 120, policy: redis, redis: { host: redis, port: 6379, timeout: 2000, database: 0 }, limit_by: ip }

# 全局 pre-function：cookie pf_access → Authorization: Bearer（SSO，specs/006）
plugins:
  - name: pre-function
    config:
      access:
        - |
          local h = kong.request.get_header("authorization")
          if not h then
            local ck = kong.request.get_header("cookie")
            if ck then
              local t = string.match(ck, "pf_access=([^;%s]+)")
              if t then kong.service.request.set_header("authorization", "Bearer " .. t) end
            end
          end
  # 计量（specs/013）：结构化 JSON 访问日志到 stdout，含 app key / request id / route / status
  # 由 promtail 采集进 Loki。log serializer 自带 request.headers，promtail 侧提取 X-PF-App-Key。
  - name: file-log
    config:
      path: /dev/stdout
      custom_fields_by_lua:
        pf_app_key: "return kong.request.get_header('x-pf-app-key') or ''"
        pf_request_id: "return kong.request.get_header('x-request-id') or kong.ctx.shared.request_id or ''"

