name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go:
    name: Go 构建与清单校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            platform/auth/go.sum
            tools/platctl/go.sum

      - name: auth 底座 vet + build
        working-directory: platform/auth
        run: |
          go mod tidy
          go vet ./...
          CGO_ENABLED=0 go build -o /dev/null .

      - name: platctl vet + build
        working-directory: tools/platctl
        run: |
          go mod tidy
          go vet ./...
          go build -o platctl .

      - name: 服务清单校验（platctl check）
        run: ./tools/platctl/platctl check

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备环境文件
        run: cp .env.example .env

      - name: 构建全部镜像
        run: docker compose build
